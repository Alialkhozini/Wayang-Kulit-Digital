<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayang Kulit — Camera</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0604;
        color: #cdb894;
        font: 15px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #cam {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        cursor: zoom-in;
      }
      :fullscreen #cam { cursor: zoom-out; }
      #msg {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      body.live #msg { display: none; }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        margin: 0;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(22, 13, 7, 0.74);
        border: 1px solid rgba(217, 164, 65, 0.28);
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      #hint.gone { opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="cam" aria-label="Camera with hand tracking"></canvas>
    <p id="msg" role="status"></p>
    <p id="hint">Drag this window to another screen · double-click for fullscreen</p>
    <script type="module" src="src/camera-window.js"></script>
  </body>
</html>
